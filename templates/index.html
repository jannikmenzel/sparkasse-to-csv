<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Sparkasse-to-CSV</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<!-- Header -->
<header class="hero-section text-center text-light">
    <div class="container py-5">
        <img src="{{ url_for('static', filename='assets/icons/icon.svg') }}" alt="Cover" class="cover-img mb-4">

        <h1 class="display-3">Sparkasse-to-CSV</h1>
        <p class="lead">Willkommen auf dem <span class="highlight">Sparkasse-to-CSV</span> für Kontoauszüge der Sparkasse.</p>
    </div>
</header>

<!-- PDF Upload Form -->
<div class="container py-5">
    <h2>PDF hochladen</h2>
    <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="file" class="form-label">Wählen Sie eine oder mehrere PDF-Dateien aus</label>
            <input type="file" class="form-control" id="file" name="file" accept=".pdf" multiple required>
            <div class="form-text">Alle ausgewählten Kontoauszüge werden zusammengeführt und als eine CSV exportiert.</div>
        </div>
        <button id="uploadButton" type="submit" class="btn btn-primary">
            <span
                id="uploadSpinner"
                class="spinner-border spinner-border-sm me-2 d-none"
                role="status"
                aria-hidden="true"
            ></span>
            <span id="uploadButtonText">PDF hochladen und CSV generieren</span>
        </button>

        <div id="uploadProgressWrapper" class="mt-3 d-none" aria-live="polite">
            <label for="uploadProgressBar" class="form-label mb-1">Upload-Fortschritt</label>
            <div class="progress" role="progressbar" aria-label="Upload-Fortschritt" aria-valuemin="0" aria-valuemax="100">
                <div
                    id="uploadProgressBar"
                    class="progress-bar progress-bar-striped progress-bar-animated"
                    style="width: 0%"
                >0%</div>
            </div>
            <div id="uploadStatus" class="form-text mt-1">Dateien werden vorbereitet...</div>
        </div>
    </form>
</div>

<!-- Footer -->
<footer class="bg-dark py-4 text-center text-light">
    <p>&copy; 2025 Jannik Menzel</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const uploadForm = document.getElementById('uploadForm');
    const uploadButton = document.getElementById('uploadButton');
    const uploadSpinner = document.getElementById('uploadSpinner');
    const uploadButtonText = document.getElementById('uploadButtonText');

    uploadForm.addEventListener('submit', function () {
        uploadButton.disabled = true;
        uploadSpinner.classList.remove('d-none');
        uploadButtonText.textContent = 'Upload läuft...';
    });
</script>
</body>
</html>
